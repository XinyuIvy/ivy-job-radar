<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ivy Job Autofill</title><link rel="stylesheet" href="popup.css"></head><body><main><p class="eyebrow">IVY JOB RADAR · AUTOFILL V4.13</p><h1>Application Autofill</h1><p class="help">先选择本次填写使用中文或英文固定资料。扩展只填写空白字段，并在能安全匹配当前 APP 时上传对应的最终定制 CV；不会自动提交。</p><section id="context" class="context"><strong>正在识别当前申请…</strong><span>如果无法唯一识别，可以从已提交申请中手动选择。</span></section><label id="candidateWrap" class="candidate hidden"><span>选择当前申请</span><select id="candidate"></select></label><label class="profile-language"><span>本次填写资料</span><select id="profileLanguage"><option value="zh">中文资料</option><option value="en">English profile</option></select><small>扩展会记住你的选择，直到你下次切换。</small></label><button id="fill" class="primary">填写当前申请页 + CV</button><button id="questions" class="hidden">复制未填问题</button><button id="import">从当前 Job Radar 页面导入连接</button><button id="options">编辑本地回退资料</button><p id="status" aria-live="polite"></p></main><script src="popup.js"></script><script src="manual-fallback.js"></script></body></html>
