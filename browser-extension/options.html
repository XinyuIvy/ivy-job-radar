<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ivy Job Autofill Profile</title><style>body{margin:0;background:#f5f2e9;color:#1f2c25;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:900px;margin:0 auto;padding:32px 20px 80px}h1{font:700 40px/1.1 Georgia,serif;margin:0 0 8px}.note{color:#59665f;max-width:760px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:24px}.section{grid-column:1/-1;font:700 22px Georgia,serif;margin-top:12px}.field{display:grid;gap:5px}.field label{font-size:12px;font-weight:800;color:#5e6b63}.field input,.field select{box-sizing:border-box;width:100%;border:1px solid #cfcabc;border-radius:9px;background:#fffef9;padding:10px 11px;font:inherit}.actions{display:flex;gap:10px;margin-top:24px;flex-wrap:wrap}button{border:0;border-radius:10px;padding:11px 16px;font-weight:800;cursor:pointer;background:#16794b;color:white}button.secondary{background:#fffef9;color:#1f2c25;border:1px solid #cfcabc}#status{margin-top:12px;color:#35664c}@media(max-width:650px){.grid{grid-template-columns:1fr}.section{grid-column:1}}</style></head><body><main><h1>申请资料</h1><p class="note">这些信息只保存在 Chrome 扩展的本地 storage。不会自动提交申请，也不会自动填写 EEO、性别、种族、残障、退伍军人等敏感字段。</p><form id="profileForm"><div class="grid" id="fields"></div><div class="actions"><button type="submit">保存资料</button><button class="secondary" type="button" id="export">复制 JSON</button><button class="secondary" type="button" id="import">粘贴 JSON</button></div></form><p id="status"></p></main><script src="options.js"></script></body></html>
