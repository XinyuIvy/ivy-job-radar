name: Apply full JD prompt patch

on:
  push:
    branches:
      - fix/full-jd-in-cv-prompt

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/full-jd-in-cv-prompt
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply patch
        run: python .github/apply-full-jd-prompt.py
      - name: Commit patched files
        run: |
          if git diff --quiet; then
            echo "No patch changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/lib/application-archive.ts app/api/cv-tailor/archive/route.ts tests/test_application_archive_source.py
          git commit -m "Require complete JD in CV tailoring prompt"
          git push origin HEAD:fix/full-jd-in-cv-prompt
