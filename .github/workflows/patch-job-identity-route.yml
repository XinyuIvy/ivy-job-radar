name: Patch job identity route

on:
  push:
    branches:
      - fix/job-identity-ignore-and-url-add
    paths:
      - scripts/patch_job_identity_route.py
      - .github/workflows/patch-job-identity-route.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/job-identity-ignore-and-url-add
          fetch-depth: 0
      - name: Apply route patch
        run: python3 scripts/patch_job_identity_route.py
      - name: Remove one-off patcher and commit result
        run: |
          rm scripts/patch_job_identity_route.py .github/workflows/patch-job-identity-route.yml
          git add app/api/jobs/route.ts scripts/patch_job_identity_route.py .github/workflows/patch-job-identity-route.yml
          if git diff --cached --quiet; then
            echo "No patch changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Apply stable job identity to jobs API"
          git push origin HEAD:fix/job-identity-ignore-and-url-add
