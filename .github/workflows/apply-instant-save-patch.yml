name: Apply instant application save patch

on:
  push:
    branches:
      - fix/instant-application-save
    paths:
      - ".github/apply-instant-save-patch.py"
      - ".github/workflows/apply-instant-save-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/instant-application-save
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply source patch
        run: python .github/apply-instant-save-patch.py
      - name: Commit patched source
        run: |
          if git diff --quiet; then
            echo "Patch already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/job-radar.tsx db/index.ts tests/test_application_save_performance.py
          git commit -m "Make application record saves immediate"
          git push origin HEAD:fix/instant-application-save
