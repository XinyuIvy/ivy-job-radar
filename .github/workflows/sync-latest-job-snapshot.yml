name: Sync latest job snapshot

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: daily-us-jobscan
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download latest raw collection artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          latest_run=$(gh run list --workflow daily-us-jobscan.yml --status completed --limit 1 --json databaseId --jq '.[0].databaseId')
          test -n "${latest_run}"
          gh run download "${latest_run}" --name "raw-jobscan-${latest_run}" --dir data/scans
          test -s data/scans/raw_jobs_latest.json
      - name: Replay raw records through shared backend
        env:
          IVY_JOB_RADAR_SYNC_TOKEN: ${{ secrets.IVY_JOB_RADAR_SYNC_TOKEN }}
          SITES_SIWC_BYPASS_TOKEN: ${{ secrets.SITES_SIWC_BYPASS_TOKEN }}
        run: python scripts/sync_raw_jobs.py
      - name: Preserve replay receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ingestion-replay-${{ github.run_id }}
          path: data/scans/backend_ingestion_receipt_latest.json
          retention-days: 30
