name: Daily US job scan and application preparation

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-us-jobscan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Mark website scan as running
        env:
          IVY_JOB_RADAR_SYNC_TOKEN: ${{ secrets.IVY_JOB_RADAR_SYNC_TOKEN }}
          SITES_SIWC_BYPASS_TOKEN: ${{ secrets.SITES_SIWC_BYPASS_TOKEN }}
        shell: bash
        run: |
          if [[ -n "${IVY_JOB_RADAR_SYNC_TOKEN}" && -n "${SITES_SIWC_BYPASS_TOKEN}" ]]; then
            curl --fail-with-body --retry 3 --retry-all-errors \
              --request POST \
              --header "Content-Type: application/json" \
              --header "OAI-Sites-Authorization: Bearer ${SITES_SIWC_BYPASS_TOKEN}" \
              --header "Authorization: Bearer ${IVY_JOB_RADAR_SYNC_TOKEN}" \
              --data '{"state":"running","phase":"等待云端任务","current_source":"GitHub Actions","steps_completed":1,"steps_total":4,"message":"云端原始数据采集正在启动，清洗和入库由后端统一执行。"}' \
              "https://ivy-job-radar.rourou1199.chatgpt.site/api/scan-status" \
              || echo "Warning: could not publish running status."
          fi

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-jobscan.txt

      - name: Install scanner dependencies
        run: python -m pip install --requirement requirements-jobscan.txt

      - name: Validate extraction and transport code
        run: python -m py_compile scripts/collect_raw_jobs.py scripts/sync_raw_jobs.py scripts/company_portal_scan.py scripts/split_json_batches.py

      - name: Test raw collection and transport
        run: python -m unittest discover -s tests -p 'test_raw_job_collection.py'

      - name: Collect source records without cleaning or deduplication
        run: python scripts/collect_raw_jobs.py --region 美国

      - name: Send raw records to shared backend ingestion
        env:
          IVY_JOB_RADAR_SYNC_TOKEN: ${{ secrets.IVY_JOB_RADAR_SYNC_TOKEN }}
          SITES_SIWC_BYPASS_TOKEN: ${{ secrets.SITES_SIWC_BYPASS_TOKEN }}
        run: python scripts/sync_raw_jobs.py

      - name: Prepare the next ten-job review batch
        continue-on-error: true
        env:
          IVY_JOB_RADAR_SYNC_TOKEN: ${{ secrets.IVY_JOB_RADAR_SYNC_TOKEN }}
          SITES_SIWC_BYPASS_TOKEN: ${{ secrets.SITES_SIWC_BYPASS_TOKEN }}
        shell: bash
        run: |
          automation_result="$(mktemp)"
          curl --fail-with-body --retry 3 --retry-all-errors \
            --request POST \
            --header "Content-Type: application/json" \
            --header "OAI-Sites-Authorization: Bearer ${SITES_SIWC_BYPASS_TOKEN}" \
            --header "Authorization: Bearer ${IVY_JOB_RADAR_SYNC_TOKEN}" \
            --data '{}' \
            --output "${automation_result}" \
            "https://ivy-job-radar.rourou1199.chatgpt.site/api/application-automation"

          python - "${automation_result}" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              payload = json.load(handle)
          count = len(payload.get("reviewJobIds", []))
          state = "existing" if payload.get("existingBatch") else "new"
          print(f"Prepared {count} jobs in the {state} review batch. CV generation remains paused until user approval.")
          PY

      - name: Mark website scan as failed
        if: failure()
        env:
          IVY_JOB_RADAR_SYNC_TOKEN: ${{ secrets.IVY_JOB_RADAR_SYNC_TOKEN }}
          SITES_SIWC_BYPASS_TOKEN: ${{ secrets.SITES_SIWC_BYPASS_TOKEN }}
        run: >-
          curl --fail-with-body --request POST
          --header "Content-Type: application/json"
          --header "OAI-Sites-Authorization: Bearer ${SITES_SIWC_BYPASS_TOKEN}"
          --header "Authorization: Bearer ${IVY_JOB_RADAR_SYNC_TOKEN}"
          --data '{"state":"failed","message":"采集或后端统一入库失败；请检查本次运行产物与日志。"}'
          "https://ivy-job-radar.rourou1199.chatgpt.site/api/scan-status"

      - name: Upload scan artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-jobscan-${{ github.run_id }}
          path: data/scans/
          if-no-files-found: error
          retention-days: 30
