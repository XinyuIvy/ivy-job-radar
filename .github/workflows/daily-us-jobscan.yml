name: Daily global job scan

on:
  workflow_dispatch:
  schedule:
    # Run at both possible UTC offsets; the guard keeps only 6 AM New York time.
    - cron: "7 10 * * *"
    - cron: "7 11 * * *"

permissions:
  contents: write

concurrency:
  group: daily-global-jobscan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check New York schedule
        id: schedule_guard
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [[ "$(TZ=America/New_York date +%H)" == "06" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Mark website scan as running
        if: steps.schedule_guard.outputs.run == 'true'
        env:
          IVY_JOB_RADAR_SYNC_TOKEN: ${{ secrets.IVY_JOB_RADAR_SYNC_TOKEN }}
          SITES_SIWC_BYPASS_TOKEN: ${{ secrets.SITES_SIWC_BYPASS_TOKEN }}
        shell: bash
        run: |
          if [[ -n "${IVY_JOB_RADAR_SYNC_TOKEN}" && -n "${SITES_SIWC_BYPASS_TOKEN}" ]]; then
            curl --fail-with-body --retry 3 --retry-all-errors \
              --request POST \
              --header "Content-Type: application/json" \
              --header "OAI-Sites-Authorization: Bearer ${SITES_SIWC_BYPASS_TOKEN}" \
              --header "Authorization: Bearer ${IVY_JOB_RADAR_SYNC_TOKEN}" \
              --data '{"state":"running"}' \
              "https://ivy-job-radar.rourou1199.chatgpt.site/api/scan-status" \
              || echo "Warning: could not publish running status."
          fi

      - name: Check out repository
        if: steps.schedule_guard.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.schedule_guard.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-jobscan.txt

      - name: Install scanner dependencies
        if: steps.schedule_guard.outputs.run == 'true'
        run: python -m pip install --requirement requirements-jobscan.txt

      - name: Validate scanner syntax
        if: steps.schedule_guard.outputs.run == 'true'
        run: >-
          python -m py_compile
          scripts/jobspy_scan.py
          scripts/verify_company_jobs.py
          scripts/china_scan.py
          scripts/china_snapshot_import.py
          scripts/apify_zhaopin_scan.py
          scripts/merge_china_sources.py
          scripts/cloud_sources_scan.py
          scripts/aggregator_scan.py
          scripts/verify_aggregator_jobs.py
          scripts/company_portal_scan.py
          scripts/merge_scan_results.py
          scripts/scan_health.py
          scripts/split_json_batches.py

      - name: Run scanner fixture tests
        if: steps.schedule_guard.outputs.run == 'true'
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Collect US jobs
        if: steps.schedule_guard.outputs.run == 'true'
        run: python scripts/jobspy_scan.py

      - name: Verify US candidates on company career sites
        if: steps.schedule_guard.outputs.run == 'true'
        run: python scripts/verify_company_jobs.py

      - name: Collect China jobs
        if: steps.schedule_guard.outputs.run == 'true'
        run: python scripts/china_scan.py

      - name: Import committed China browser snapshots
        if: steps.schedule_guard.outputs.run == 'true'
        run: python scripts/china_snapshot_import.py data/imports/china

      - name: Collect optional paid Zhaopin source
        if: steps.schedule_guard.outputs.run == 'true'
        env:
          APIFY_ZHAOPIN_ENABLED: ${{ secrets.APIFY_ZHAOPIN_ENABLED }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python scripts/apify_zhaopin_scan.py --max-results 25

      - name: Merge every China collection route
        if: steps.schedule_guard.outputs.run == 'true'
        run: python scripts/merge_china_sources.py

      - name: Collect credential-free cloud sources
        if: steps.schedule_guard.outputs.run == 'true'
        run: python scripts/cloud_sources_scan.py

      - name: Collect Job Board Aggregator candidates
        if: steps.schedule_guard.outputs.run == 'true'
        run: python scripts/aggregator_scan.py

      - name: Verify Aggregator candidates on official ATS pages
        if: steps.schedule_guard.outputs.run == 'true'
        run: python scripts/verify_aggregator_jobs.py

      - name: Scan every company-pool career portal
        if: steps.schedule_guard.outputs.run == 'true'
        run: python scripts/company_portal_scan.py

      - name: Canonicalize, prune, and write run receipt
        if: steps.schedule_guard.outputs.run == 'true'
        run: python scripts/merge_scan_results.py

      - name: Record scan health and anomaly history
        if: steps.schedule_guard.outputs.run == 'true'
        run: python scripts/scan_health.py

      - name: Sync jobs to Ivy Job Radar
        if: steps.schedule_guard.outputs.run == 'true'
        env:
          IVY_JOB_RADAR_SYNC_TOKEN: ${{ secrets.IVY_JOB_RADAR_SYNC_TOKEN }}
          SITES_SIWC_BYPASS_TOKEN: ${{ secrets.SITES_SIWC_BYPASS_TOKEN }}
        shell: bash
        run: |
          if [[ -z "${IVY_JOB_RADAR_SYNC_TOKEN}" || -z "${SITES_SIWC_BYPASS_TOKEN}" ]]; then
            echo "::error::Website sync credentials are not fully configured."
            exit 1
          fi
          import_batch_dir="$(mktemp -d)"
          python scripts/split_json_batches.py \
            data/scans/all_jobs_latest.json \
            "${import_batch_dir}" \
            --batch-size 40 \
            --max-bytes 1000000

          shopt -s nullglob
          import_batches=("${import_batch_dir}"/batch-*.json)
          if [[ "${#import_batches[@]}" -eq 0 ]]; then
            echo "::error::No website import batches were generated."
            exit 1
          fi

          for batch_path in "${import_batches[@]}"; do
            echo "Importing $(basename "${batch_path}") of ${#import_batches[@]}"
            curl --fail-with-body --retry 3 --retry-all-errors \
              --request POST \
              --header "Content-Type: application/json" \
              --header "OAI-Sites-Authorization: Bearer ${SITES_SIWC_BYPASS_TOKEN}" \
              --header "Authorization: Bearer ${IVY_JOB_RADAR_SYNC_TOKEN}" \
              --data-binary @"${batch_path}" \
              "https://ivy-job-radar.rourou1199.chatgpt.site/api/jobs/import"
          done

      - name: Publish completed run receipt
        if: steps.schedule_guard.outputs.run == 'true'
        env:
          IVY_JOB_RADAR_SYNC_TOKEN: ${{ secrets.IVY_JOB_RADAR_SYNC_TOKEN }}
          SITES_SIWC_BYPASS_TOKEN: ${{ secrets.SITES_SIWC_BYPASS_TOKEN }}
        shell: bash
        run: |
          if [[ -z "${IVY_JOB_RADAR_SYNC_TOKEN}" || -z "${SITES_SIWC_BYPASS_TOKEN}" ]]; then
            exit 0
          fi
          python - <<'PY'
          import json
          from pathlib import Path

          receipt = json.loads(Path("data/scans/run_receipt_latest.json").read_text(encoding="utf-8"))
          payload = {
              "state": "completed",
              "message": (
                  f"本轮扫描完成：抓取 {receipt['fetched']}，"
                  f"去重后导入 {receipt['imported']}，新增 {receipt['new']}，"
                  f"失败来源 {len(receipt['failed_sources'])}。"
              ),
          }
          Path("data/scans/scan_status_payload.json").write_text(
              json.dumps(payload, ensure_ascii=False), encoding="utf-8"
          )
          PY
          curl --fail-with-body --retry 3 --retry-all-errors \
            --request POST \
            --header "Content-Type: application/json" \
            --header "OAI-Sites-Authorization: Bearer ${SITES_SIWC_BYPASS_TOKEN}" \
            --header "Authorization: Bearer ${IVY_JOB_RADAR_SYNC_TOKEN}" \
            --data-binary @data/scans/scan_status_payload.json \
            "https://ivy-job-radar.rourou1199.chatgpt.site/api/scan-status"

      - name: Mark website scan as failed
        if: failure() && steps.schedule_guard.outputs.run == 'true'
        env:
          IVY_JOB_RADAR_SYNC_TOKEN: ${{ secrets.IVY_JOB_RADAR_SYNC_TOKEN }}
          SITES_SIWC_BYPASS_TOKEN: ${{ secrets.SITES_SIWC_BYPASS_TOKEN }}
        shell: bash
        run: |
          if [[ -n "${IVY_JOB_RADAR_SYNC_TOKEN}" && -n "${SITES_SIWC_BYPASS_TOKEN}" ]]; then
            curl --fail-with-body --retry 3 --retry-all-errors \
              --request POST \
              --header "Content-Type: application/json" \
              --header "OAI-Sites-Authorization: Bearer ${SITES_SIWC_BYPASS_TOKEN}" \
              --header "Authorization: Bearer ${IVY_JOB_RADAR_SYNC_TOKEN}" \
              --data '{"state":"failed","message":"GitHub Actions 执行失败，未完成本轮回写。"}' \
              "https://ivy-job-radar.rourou1199.chatgpt.site/api/scan-status" \
              || echo "Warning: could not publish failure status."
          fi

      - name: Upload scan artifact
        if: always() && steps.schedule_guard.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: global-jobscan-${{ github.run_id }}
          path: data/scans/
          if-no-files-found: error
          retention-days: 30

      - name: Commit latest scan snapshot
        if: always() && steps.schedule_guard.outputs.run == 'true'
        shell: bash
        run: |
          if [[ -z "$(git status --short -- data/scans)" ]]; then
            echo "No scan changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/scans/
          git commit -m "Update daily global job scan"

          # The scan can run for a long time while main receives unrelated updates.
          # Rebase the generated snapshot onto the newest main before pushing.
          for attempt in 1 2 3; do
            echo "Snapshot push attempt ${attempt}/3"
            git fetch origin main

            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Snapshot rebase conflicted; the uploaded artifact remains available."
              exit 1
            fi

            if git push origin HEAD:main; then
              exit 0
            fi

            if [[ "${attempt}" -lt 3 ]]; then
              sleep $((attempt * 5))
            fi
          done

          echo "Snapshot push still failed after 3 attempts; the uploaded artifact remains available."
          exit 1
