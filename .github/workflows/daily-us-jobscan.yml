name: Daily global job scan

on:
  workflow_dispatch:
  schedule:
    # Run at both possible UTC offsets; the guard keeps only 6 AM New York time.
    - cron: "7 10 * * *"
    - cron: "7 11 * * *"

permissions:
  contents: write

concurrency:
  group: daily-global-jobscan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check New York schedule
        id: schedule_guard
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [[ "$(TZ=America/New_York date +%H)" == "06" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Mark website scan as running
        if: steps.schedule_guard.outputs.run == 'true'
        env:
          IVY_JOB_RADAR_SYNC_TOKEN: ${{ secrets.IVY_JOB_RADAR_SYNC_TOKEN }}
          SITES_SIWC_BYPASS_TOKEN: ${{ secrets.SITES_SIWC_BYPASS_TOKEN }}
        shell: bash
        run: |
          if [[ -n "${IVY_JOB_RADAR_SYNC_TOKEN}" && -n "${SITES_SIWC_BYPASS_TOKEN}" ]]; then
            curl --fail-with-body --retry 3 --retry-all-errors \
              --request POST \
              --header "Content-Type: application/json" \
              --header "OAI-Sites-Authorization: Bearer ${SITES_SIWC_BYPASS_TOKEN}" \
              --header "Authorization: Bearer ${IVY_JOB_RADAR_SYNC_TOKEN}" \
              --data '{"state":"running"}' \
              "https://ivy-job-radar.rourou1199.chatgpt.site/api/scan-status" \
              || echo "Warning: could not publish running status."
          fi

      - name: Check out repository
        if: steps.schedule_guard.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.schedule_guard.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-jobscan.txt

      - name: Install scanner dependencies
        if: steps.schedule_guard.outputs.run == 'true'
        run: python -m pip install --requirement requirements-jobscan.txt

      - name: Validate scanner syntax
        if: steps.schedule_guard.outputs.run == 'true'
        run: python -m py_compile scripts/jobspy_scan.py scripts/verify_company_jobs.py scripts/china_scan.py scripts/cloud_sources_scan.py

      - name: Collect US jobs
        if: steps.schedule_guard.outputs.run == 'true'
        run: python scripts/jobspy_scan.py

      - name: Verify US candidates on company career sites
        if: steps.schedule_guard.outputs.run == 'true'
        run: python scripts/verify_company_jobs.py

      - name: Collect China jobs
        if: steps.schedule_guard.outputs.run == 'true'
        run: python scripts/china_scan.py

      - name: Collect credential-free cloud sources
        if: steps.schedule_guard.outputs.run == 'true'
        run: python scripts/cloud_sources_scan.py

      - name: Merge regional results
        if: steps.schedule_guard.outputs.run == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          scan_dir = Path("data/scans")
          regional_files = [
              scan_dir / "us_jobs_verified_latest.json",
              scan_dir / "china_jobs_latest.json",
              scan_dir / "cloud_sources_jobs_latest.json",
          ]
          jobs = []
          for path in regional_files:
              if path.exists():
                  jobs.extend(json.loads(path.read_text(encoding="utf-8")))
          (scan_dir / "all_jobs_latest.json").write_text(
              json.dumps(jobs, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          deduplicated = {}
          for job in jobs:
              key = str(job.get("job_key") or job.get("canonical_url") or job.get("job_url") or "")
              if not key:
                  continue
              current = deduplicated.get(key)
              if current is None or int(job.get("score", 0)) > int(current.get("score", 0)):
                  deduplicated[key] = job
          jobs = list(deduplicated.values())
          (scan_dir / "all_jobs_latest.json").write_text(
              json.dumps(jobs, ensure_ascii=False, indent=2) + "\\n",
              encoding="utf-8",
          )
          print(f"Merged and deduplicated {len(jobs)} jobs from all enabled cloud sources.")
          PY

      - name: Sync jobs to Ivy Job Radar
        if: steps.schedule_guard.outputs.run == 'true'
        env:
          IVY_JOB_RADAR_SYNC_TOKEN: ${{ secrets.IVY_JOB_RADAR_SYNC_TOKEN }}
          SITES_SIWC_BYPASS_TOKEN: ${{ secrets.SITES_SIWC_BYPASS_TOKEN }}
        shell: bash
        run: |
          if [[ -z "${IVY_JOB_RADAR_SYNC_TOKEN}" || -z "${SITES_SIWC_BYPASS_TOKEN}" ]]; then
            echo "Website sync credentials are not fully configured; skipping website sync."
            exit 0
          fi
          curl --fail-with-body --retry 3 --retry-all-errors \
            --request POST \
            --header "Content-Type: application/json" \
            --header "OAI-Sites-Authorization: Bearer ${SITES_SIWC_BYPASS_TOKEN}" \
            --header "Authorization: Bearer ${IVY_JOB_RADAR_SYNC_TOKEN}" \
            --data-binary @data/scans/all_jobs_latest.json \
            "https://ivy-job-radar.rourou1199.chatgpt.site/api/jobs/import"

      - name: Mark website scan as failed
        if: failure() && steps.schedule_guard.outputs.run == 'true'
        env:
          IVY_JOB_RADAR_SYNC_TOKEN: ${{ secrets.IVY_JOB_RADAR_SYNC_TOKEN }}
          SITES_SIWC_BYPASS_TOKEN: ${{ secrets.SITES_SIWC_BYPASS_TOKEN }}
        shell: bash
        run: |
          if [[ -n "${IVY_JOB_RADAR_SYNC_TOKEN}" && -n "${SITES_SIWC_BYPASS_TOKEN}" ]]; then
            curl --fail-with-body --retry 3 --retry-all-errors \
              --request POST \
              --header "Content-Type: application/json" \
              --header "OAI-Sites-Authorization: Bearer ${SITES_SIWC_BYPASS_TOKEN}" \
              --header "Authorization: Bearer ${IVY_JOB_RADAR_SYNC_TOKEN}" \
              --data '{"state":"failed","message":"GitHub Actions 执行失败，未完成本轮回写。"}' \
              "https://ivy-job-radar.rourou1199.chatgpt.site/api/scan-status" \
              || echo "Warning: could not publish failure status."
          fi

      - name: Upload scan artifact
        if: always() && steps.schedule_guard.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: global-jobscan-${{ github.run_id }}
          path: data/scans/
          if-no-files-found: error
          retention-days: 30

      - name: Commit latest scan snapshot
        if: always() && steps.schedule_guard.outputs.run == 'true'
        shell: bash
        run: |
          if [[ -z "$(git status --short -- data/scans)" ]]; then
            echo "No scan changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/scans/
          git commit -m "Update daily global job scan"
          git push
