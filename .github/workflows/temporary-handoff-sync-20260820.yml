## 0. 2026-08-20 权威交接：真实申请 / CV / Autofill 已跑通，当前只完成 UX 与性能收尾

> **本节是当前最高优先级状态说明。** 若它与下面 2026-08-12 或更早的历史章节冲突，以本节和仓库当前代码为准。历史章节保留用于追溯，不要据此重启已经结束的 RAG / shadow / migration 工作。

### 0.1 三个仓库的职责边界

- `XinyuIvy/CV`：长期事实母版、canonical indexes、行业中英文 TeX 母版、全站共用 Autofill profile。不要把某一岗位的最终定制 CV 当成事实母版反写进去。
- `XinyuIvy/job-application-archive`（private）：每个 `APP-...` 的冻结 JD、冻结事实快照、所选母版、Chat Prompt、最终 TeX/PDF/TXT/build manifest/application autofill packet，以及明确确认后的 submitted snapshot。
- `XinyuIvy/ivy-job-radar`：岗位采集/筛选、候选与申请工作流、定制 CV 入口、Autofill bridge / Chrome extension 和用户界面。它不是复杂 CV 编辑器，也不应在站内自动改写最终 CV。

### 0.2 当前已合并的 Job Radar 产品基线

- 最近一个有产品功能变化且已合并的基线是 PR #100，merge commit `6fd8a7e89f400393195a1db51b6495f2cf163a7e`：**收藏 + 待提交申请已经合并为一个“候选岗位”列表**。
- 统一候选页没有“收藏 / 待提交”两个状态切换：星标岗位和 `status=准备材料` 的 application 放在同一列表；同一 logical job 只显示一次，application record 优先。
- 已提交 / 面试 / Offer / 拒绝仍在“申请”页按申请阶段管理。
- 手动 Chrome 保存进入候选/待投递后，不应再重复出现在“今日岗位”。隐藏判断以实际 stored URL 优先，logical identity 为兜底。
- Fast UI v1（PR #99）已经合并：大数据按 tab 懒加载、扫描轮询只在相关页面、分页、乐观保存/删除、application duplicate lookup 缩小候选集等。
- `main` 在 PR #100 后只发生过 handoff/维护类提交时，不要把这些维护 commit 误解为新的产品部署版本。

### 0.3 CV 定制：母版和语言现在是一级权威输入

- PR #95 恢复了 **CV 母版必选**：系统可以给建议，但用户必须在建立申请档案前明确选择 canonical TeX mother template。
- PR #98（merge `181c03a286de3c124e74b21ef00bf533d0aa3888`）修复了“选中文母版却继续出英文”的根因：
  - 页面选择的 `language + templateFile` 是一级权威输入；
  - `application_record.yaml`、`cv_base.tex`、`chat_prompt.txt` 必须三者一致；
  - Prompt 必须显式写本次输出语言和已确认母版，并要求最终自然语言内容保持该语言，不能因为 JD 为英文自行切回英文；
  - 已存在但**还没有 final customized CV** 的旧 APP，如果本次母版选择不同，可以安全 re-freeze；
  - 已经有 final customized TeX/PDF 或 submitted snapshot 的 APP 不得静默覆盖历史版本，必须显式提示冲突/版本处理。
- 旧 APP 可能历史上冻结了错误语言。例如 `APP-2026-16M-0032` 曾冻结 `language=en` + `cv_tech.tex`；这类旧记录不能用来否定新母版选择逻辑。

### 0.4 Archive / PDF 构建的当前规则

- Chat 在用户明确最终确认后写 `cv_customized_<APP-ID>.tex`；archive GitHub Action 用 LuaLaTeX 编译并生成 PDF、TXT、build manifest 和 `application_autofill_<APP-ID>.json`。
- 普通新 CV 仍然以 `<= 2 pages` 为硬门槛。
- 已经明确确认“Actual submitted version confirmed”的历史真实提交版本，如果超过 2 页，允许**原样归档**并在 manifest 记录页数例外；不能为了过 validator 擅自删改已提交内容。
- Archive 已补缺失/过期产物恢复机制：final TeX 存在但 PDF/TXT/autofill/manifest 缺失或落后时可以自动补建。
- `APP-2026-16M-0032` 的 3 页 final TeX 曾因此被旧 validator 拒绝；修复后 PDF/TXT/autofill/manifest 已真实落盘。不要再让用户重新定稿来“解决”这类构建问题。

### 0.5 Autofill 的三层权威来源

1. **Global Application Profile（所有招聘网站通用）**：`XinyuIvy/CV/master/application-forms/application-autofill-profile.md`。教育详细资料、学院、导师、研究单位、GPA/排名、研究领域等放这里；不是 Tencent-specific profile。
2. **Site-specific override**：只放某网站特有字段（例如某站特殊下拉、事业群、调剂选项）。不要在这里维护项目描述或重复教育 master data。
3. **APP-specific final CV packet**：项目/经历名称、顺序、描述、技能、publication、项目链接和对应 final PDF 以当前 `APP-ID` 的最终 CV 为准。Global profile 不能覆盖 APP-specific 项目叙述。

其他 Autofill 现状：
- DB 中“已提交”概念对应真实存储状态 `已申请`；PR #92 已修复此前误用字符串 `已提交` 导致 0 candidates 的问题。
- PR #93 修复手动选择 APP 后点击填写时 selected APP 丢失的问题。
- General education Autofill 已改为跨网站通用，不按腾讯/字节硬编码；自定义 DOM 会用邻近 label / 教育 block context 识别字段，并优先用当前教育 block 已显示的学校锁定 global profile record，而不是按第几个 block 猜。
- `学历类型` 与 `学历` 在不同网站可能不是同义词；如果 options 语义未确认，不要把本科/硕士/博士强塞进“学历类型”。
- APP packet parser 会从最终 TeX 的 `\href` / `\url` 提取项目链接；“独立数据与 AI 系统”也按 project section 解析。CV 里没有的 URL 不要猜。
- Chrome extension 仍然是 user-triggered、never submit、skip sensitive EEO；不会自动点击“Add another experience/project”。

