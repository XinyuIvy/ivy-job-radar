- `/api/jobs` 直接返回 `saved` flag，减少一次独立 saved-jobs 初始请求；D1 查询并行；tracked-application matching 使用 stable-id / role candidate maps；display dedupe 从 O(n^2) `findIndex` 改为 map-based O(n) 路径，同时必须保留“不同 stable requisition ID 不可误合并”。
- `/api/jobs` 有很短的 warm-worker visible-list cache；mutation 时必须失效。
- D1 `getDb()` 加 `app_meta.schema_version` fast path，避免新 worker isolate 每次重复几十个 CREATE/PRAGMA round trips；同一 table 的 PRAGMA column info 只读一次；补了 applications/jobs/saved/ignored 热路径索引。
- Candidate fact-fit 改为 `IntersectionObserver`：卡片接近 viewport 才开始分析，避免候选页打开就同时请求所有 CV analysis；MutationObserver 只做防抖增强。
- `ApplicationCvActions` 不再为了给候选卡加“定制 CV”而全量请求 applications，而是直接读 React 输出的 `data-application-row-id`。
- Navigation state persistence 移除了全页面 DOM MutationObserver，改为 click/change/input/pageshow/popstate + debounce。
- 历史全局组件 `JobDataCache`、`PendingJobVisibility`、`OptimisticDashboardActions` 已从 layout 移除，因为对应功能已迁到 React / API 权威路径；这一步消除了旧的 5 秒整表 applications polling 和多层全 DOM observer。
- `PendingApplicationLiveSync` 目标是只负责 BroadcastChannel/storage/focus 通知，并 dispatch `ivy-job-radar:pending-refresh`；真正的 applications refresh 由候选页 JobRadar debounce 执行。
- Hard-requirement ignore 改为本地乐观移除 + event，不再 `window.location.reload()`。
- Verification queue enhancement 应只在 verify view 可见时工作，并做 debounce，避免所有页面都去读 `job-requests + applications + data-quality`。
