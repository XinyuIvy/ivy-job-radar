### 0.7 面向外部用户的产品原则（接下来所有 UX 优化都按这个判断）

- 第一次使用的人应该只需要理解主路径：**今日 -> 候选 -> 定制 CV / 投递 -> 申请进度**。高级维护功能不要占主导航。
- 高频点击必须优先做本地/乐观反馈；durable write / reconcile 放后台，失败再 rollback。不要保存后为了“确认”就全页 reload 或全表 refetch。
- 页面数据按 view 懒加载；不在当前 view 的定时轮询和 API 请求必须停掉。
- 大列表必须分页/虚拟化/延迟计算；昂贵评分只在用户快看到时运行。
- 搜索/筛选应该用用户语言，不暴露内部 track/source/schema 概念；高级筛选渐进展开，不要默认把所有控制器铺满屏幕。
- “刷新”区分两种语义：普通 UI 数据 refresh 应快且可缓存；真正抓取新招聘数据的 scan 是显式后台工作，不要把两者混成一个阻塞按钮。

### 0.8 部署 / 更新规则（务必区分）

- **代码 merge != Site 已部署。** Job Radar Site 只有在用户明确让 `@Sites` 同步最新 `main` 后才算部署。
- **Site-only change**：只需要同步 Site；不需要用户本地 `git pull` / Chrome Reload。
- **browser-extension change**：用户本地 repo `git pull origin main` + `chrome://extensions` Reload；如果后端没改，不需要 Site sync。
- **Site + extension 都改**：两边都做。
- **archive-only change**：既不需要 Site sync，也不需要扩展 Reload。
- Bookmarklet 是浏览器本地保存的 JS；bookmarklet 代码改变时需要重新安装/拖拽更新，不能假设 Site sync 会更新已有 bookmark。

### 0.9 不要重新做的事情

- 不要重启旧 RAG v2.1 / shadow validation / embedding 重建；当前方案是模型读完整 JD + 当前 CV + 全部 canonical facts，RAG 仅作 evidence-ID-specific 回查。
- 不要用 retrieval score 判定 Direct / Transferable / Adjacent。
- 不要 bulk migrate / delete 历史 applications，除非用户明确要求。
- 不要覆盖已经 final/submitted 的 APP archive 历史版本。
- 不要把 private JD / private application archive 写到 public repo。
- 不要把站点建议母版当成最终母版；用户手动选择才是一级权威。
- 不要因为某个网站 Autofill 字段识别失败就把全局 profile 拆成某公司专属 profile；先修通用 field/context recognition。

### 0.10 当前日常操作的简化心智模型

`发现/手动保存真实 JD -> 候选岗位 -> 选择母版 + 确认完整 JD -> 复制 Prompt 到新 Chat -> Chat 审核事实与文字 -> 用户确认 final TeX -> archive Action 生成 PDF/TXT/autofill -> 实际投递后状态改为已申请 -> Chrome Autofill 读取当前 APP final packet + Global Profile`。

在任何新 Chat 接手时，先确认当前 `main`、PR #101 最新 head/CI 和 `PROJECT_HANDOFF.md` 本节，再决定继续开发；不要依赖旧聊天里缓存的 commit SHA。
