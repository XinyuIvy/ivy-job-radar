name: Test China recruitment platforms

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-china-recruitment-platforms
  cancel-in-progress: true

jobs:
  test-platforms:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-jobscan.txt

      - name: Install scanner dependencies
        run: python -m pip install --requirement requirements-jobscan.txt

      - name: Validate China platform scanner syntax
        run: >-
          python -m py_compile
          scripts/china_scan.py
          local-collector/boss_one_click.py
          local-collector/boss_radar.py
          local-collector/china_one_click.py

      - name: Test BOSS and China platform parsing and filtering
        shell: bash
        run: |
          python -m unittest discover -s tests -p 'test_boss*.py'
          python -m unittest discover -s tests -p 'test_china*.py'

      - name: Run public recruitment-platform smoke scan
        run: >-
          python scripts/china_scan.py
          --config config/china_search_queries.json
          --output-dir /tmp/china-platform-test
          --progress-file /tmp/china-platform-progress.json

      - name: Print platform scan summary
        run: python -m json.tool /tmp/china-platform-test/china_scan_summary.json

      - name: Upload platform test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: china-platform-test-${{ github.run_id }}
          path: |
            /tmp/china-platform-test/
            /tmp/china-platform-progress.json
          if-no-files-found: warn
          retention-days: 7
