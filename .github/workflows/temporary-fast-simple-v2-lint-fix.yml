name: Temporary Fast Simple v2 lint fix

on:
  pull_request:
    branches: [main]
    paths:
      - tools/fix_fast_simple_v2_lint.py

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - run: python tools/fix_fast_simple_v2_lint.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/job-radar.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Initialize cached jobs before first render'
          git push origin HEAD:${{ github.head_ref }}
