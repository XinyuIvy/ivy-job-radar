name: Patch ingestion identity

on:
  push:
    branches:
      - fix/job-identity-ignore-and-url-add
    paths:
      - scripts/patch_ingestion_identity.py
      - .github/workflows/patch-ingestion-identity.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/job-identity-ignore-and-url-add
          fetch-depth: 0
      - name: Apply ingestion patches
        run: python3 scripts/patch_ingestion_identity.py
      - name: Remove one-off patcher and commit result
        run: |
          rm scripts/patch_ingestion_identity.py .github/workflows/patch-ingestion-identity.yml
          git add app/api/bookmark-capture/route.ts app/api/jobs/import/route.ts app/api/manual-review/route.ts scripts/patch_ingestion_identity.py .github/workflows/patch-ingestion-identity.yml
          if git diff --cached --quiet; then
            echo "No patch changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Apply stable identity across job ingestion"
          git push origin HEAD:fix/job-identity-ignore-and-url-add
