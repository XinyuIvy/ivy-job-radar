name: Run P0 salary policy on pull request

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: agent/remove-china-salary-hard-filter
          fetch-depth: 0

      - name: Extract and run the one-off edit script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/p0-remove-china-salary-filter.yml').read_text(encoding='utf-8')
          start = workflow.index("          python - <<'PY'")
          end = workflow.index("\n          PY", start) + len("\n          PY")
          Path('/tmp/apply-p0.sh').write_text(textwrap.dedent(workflow[start:end]) + '\n', encoding='utf-8')
          PY
          bash /tmp/apply-p0.sh
          rm -f .github/workflows/p0-pr-trigger.yml

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-jobscan.txt

      - name: Install Python dependencies
        run: python -m pip install --requirement requirements-jobscan.txt

      - name: Run Python validation
        shell: bash
        run: |
          python -m py_compile local-collector/boss_radar.py scripts/china_scan.py scripts/company_portal_scan.py
          python -m unittest discover -s tests -p 'test_boss*.py'
          python -m unittest discover -s tests -p 'test_china*.py'
          python -m unittest tests.test_company_portal_scan tests.test_salary_policy

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Run website lint and build
        run: |
          npm run lint
          npm run build

      - name: Commit validated changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove China salary hard filters"
          git push origin HEAD:agent/remove-china-salary-hard-filter
