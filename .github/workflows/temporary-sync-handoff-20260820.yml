### 0.7 PR #101 / Fast Simple v2 的设计目标与已实现代码

PR #101 同时做“更简单”和“更快”，但当前只存在于 feature branch。

#### 用户侧简化

目标导航从 6 个主入口收敛为 5 个：

- 今日
- 候选
- 申请
- 工具
- 我的

公司研究、岗位核验、忽略名单、Autofill、Chrome 保存按钮、CV 知识库、筛选学习等低频/高级功能集中进入“工具”，不再在主导航或全局右下角同时堆入口。

筛选改为 progressive disclosure：

- 搜索框始终可见；
- 地区使用“全部 / 美国 / 中国”直观 chips；
- 方向与排序放进“筛选”；
- 提供“清除筛选”；
- 行业内部 key 不直接暴露给普通用户，显示为“数据 / AI、量化、医药 / 生物统计、医疗器械、医疗 AI、咨询”等易懂标签；
- 排序文案改为“最适合我 / 最新发布 / 最近核验 / 优先岗位”。

今日页增加 3 步 quick start：找岗位 → 保存到候选 → 定制 CV 后投递。扫描 dashboard 默认折叠为“更新岗位”；申请页 analytics / tasks / calendar 默认收进“统计与日程”。高级信息只有用户展开时才加载/轮询。

#### 客户端性能

- 搜索使用 `useDeferredValue`，避免每个键击阻塞长列表。
- jobs 使用 sessionStorage stale-while-revalidate 风格缓存，首屏可先显示最近岗位再后台获取新结果。
- `/api/jobs` 响应携带 saved flag，目标是减少首屏单独读取 saved-jobs 的请求。
- 收藏/取消、application 保存、ignore 等继续走 optimistic UI；失败再回滚/对账。
- 候选 application card 暴露 `data-application-row-id`，`ApplicationCvActions` 不再为了注入“定制 CV”读取整张 applications。
- Fact-fit scoring 使用 `IntersectionObserver`，只有卡片接近 viewport 才开始评分；DOM observer 做 debounce。
- `NavigationStatePersistence` 已去掉全页面 MutationObserver，改为事件驱动 + 延迟恢复。
- 历史全局 `JobDataCache` monkey-patch、`PendingJobVisibility` 的 5 秒 applications 轮询、`OptimisticDashboardActions` 的全页 observer 已从 branch layout 移除；功能由 React state / `/api/jobs` / 明确事件承担。

#### 后端性能

`/api/jobs` 当前 branch 方向：

- ignored / saved / tracked applications / jobs 查询并行；
- tracked application 先按 stable ID / role 建索引，再做精确 logical identity，避免每个 job 对所有 applications 做 `some()`；
- dedup 从 O(n²) reducer 改为 map-based O(n) candidate lookup，同时必须保留“不同 stable requisition IDs 不能误合并”的边界；
- warm worker 有极短期 visible-jobs cache，减少瞬时重复读。

D1 cold-start：

- 引入 `RUNTIME_SCHEMA_VERSION = "2026-08-20-fast-simple-v2"`；
- `app_meta` 保存 schema version；
- 新 worker 若 schema version 已匹配，只做一次 metadata lookup，不再重复几十次 CREATE/PRAGMA；
- `ensureColumn` 的 `PRAGMA table_info` 按 table 缓存；
- 增加 applications / jobs 热路径 indexes。

### 0.8 PR #101 当前 Python CI 为什么失败，以及怎么修

当前 Python test failure 主要来自**旧测试锁死了已经被 Fast Simple v2 有意淘汰的实现**。下一 Chat 必须更新测试去验证新 contract，**不能为了让旧测试变绿而恢复旧重型行为**。

当前已确认的 stale test families 包括：

1. `test_application_save_performance`：旧断言要求保存后 `await loadApplications()`；v2 热路径故意取消整表 reload。
2. `test_application_cv_actions_source`：旧断言要求 component 自己读取 applications、识别旧按钮文案；v2 使用 card 上 `data-application-row-id` + `编辑记录`，避免额外 API。
3. `test_bookmark_capture_source`：旧断言要求 `/bookmarklet` 出现在 root `layout.tsx`；v2 将其放进“工具”页。
4. `test_cv_knowledge_base_source`：同理，`/cv-knowledge` 已从全局浮动入口迁到“工具”。
5. `test_job_identity_and_ignore_regressions`：旧断言锁死 O(n²) reducer 的精确源码字符串 `sameDisplayedJob(candidate, row)`；新 route 用 `sameDisplayedJob(current, row)` 配合 map-based dedup。
6. hard-requirement ignore 旧测试要求 `window.location.reload()`；v2 明确改成事件 `ivy-job-radar:job-ignored`，避免整页刷新。
7. navigation persistence 旧测试要求脚本扫描并改写所有外链；v2 不再用 whole-body observer 做这件事，链接自身应声明 target/rel。
8. pending live sync 旧测试要求直接 DOM 注入“收藏与待提交”旧列表并在 component 内全量 server reconcile；v2 只发布 `ivy-job-radar:pending-refresh`，统一候选 React view 负责对账。
9. unified candidate tests 仍锁死旧 copy `我的候选岗位（...）`；v2 copy 是 `候选岗位（...）`。

最近一次失败日志还显示测试总量约 230，存在多条 stale failures。继续时先读取**最新失败日志**，不要只按这份列表盲改；将 test assertions 改成 contract-level 验证后重新跑全部 Python tests、lint、build 和 China platform tests。

### 0.9 PR #101 合并前还应继续检查的性能点

即使 stale tests 修完，也建议再做一次 source audit 后再标 Ready：

- `VerificationQueueActions` 当前仍全局挂载；它历史实现会在 observer 触发时读取 `/api/job-requests`、`/api/applications`、`/api/data-quality`。优先把它限制到“核验”view 或改成明确事件驱动，避免普通今日/候选页面承担这笔成本。
- `HardRequirementIgnoreActions` 仍有 MutationObserver；已经 debounce，但可继续评估是否只在 ignore modal 打开时工作。
- `/api/jobs` 仍保留 legacy `initialJobs` / `seedInitialJobs()` 生产请求内 seed 逻辑。之前已识别为可进一步清理的冷启动写开销；在确认这些 seed 不再承担必要迁移/演示职责后再删除，不能未经核对硬删。
- application analytics 不应因每个 application state 变化自动全量重算；只在用户展开 analytics 或明确需要时刷新。
- 继续坚持服务端分页/按需字段返回是后续扩展方向；当前 v1/v2 已减少前端 render，但大数据量下仍可进一步减少网络 payload。

