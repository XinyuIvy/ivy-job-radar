### 0.1 当前面向用户的主流程

当前稳定工作流仍是：

1. 用户从 Job Radar 找到真实岗位，保存到候选池或通过 Chrome 保存岗位。
2. **“收藏”与“待提交申请”已经合并为一个“候选岗位”列表**；不再维护两个用户可见 bucket / toggle。同一个逻辑岗位若同时有 bookmark 和 `准备材料` application，只显示一次，application record 优先。
3. 候选 application 可以进入“定制 CV”。Job Radar 负责冻结申请输入并生成 Prompt；Chat 负责独立证据审核、文本修改、TeX/PDF 迭代；内容定稿前不得写最终 TeX。
4. 实际投递后状态进入“申请”；面试、Offer、拒绝继续由申请 tracker 管理。
5. Chrome Autofill 使用全局申请资料 + 当前 APP 最终 CV packet；项目/经历等岗位相关内容不从 general profile 复制第二套。

已合并的候选列表锚点：

