### 0.2 CV 母版与语言现在是一级权威输入

2026-08-20 已修复两个相关问题：

- **PR #95**：恢复“定制 CV”前的必选母版选择。系统可以推荐行业方向，但不能静默替用户决定最终母版。
- **PR #98**：修复母版/语言未贯穿 archive 和 Prompt 的问题。用户选择的 `template + language` 是一级权威；`application_record.yaml`、`cv_base.tex` 与 `chat_prompt.txt` 必须一致。

当前正确约束：

- 选择中文母版后，Prompt 必须显式写明 `language = zh` 和具体 `*_cn.tex` 母版；最终 Summary、技能、经历、项目、论文/荣誉等自然语言必须是中文，不能因 JD 为英文自动切回英文。
- 选择英文母版时同理。
- 已有 application archive 若尚未最终定稿、且冻结母版与用户本次选择不同，可以按本次明确选择重新冻结输入。
- 若该 APP 已经存在最终 customized TeX/PDF 或 submitted PDF，不得静默覆盖历史最终版；应明确提示母版冲突并要求用户决定 revision 路径。
- 旧 archive 的 `chat_prompt.txt` 不能因为“文件已存在”就无条件复用并忽略本次 template selection。

### 0.3 Application archive / PDF build 当前状态

私有归档仓库 `XinyuIvy/job-application-archive` 已长期投入实际使用；下方旧章节里“archive repo 尚未创建”“第一份真实 bundle 尚未产生”的说法均已失效。

当前 PDF pipeline：

- Chat 最终确认后写 `cv_customized_<APP-ID>.tex`。
- archive GitHub Action 使用 LuaLaTeX 构建 PDF，同时生成 TXT、`application_autofill_<APP-ID>.json` 与 build manifest。
- 普通新 CV 继续严格执行 `<= 2 pages`。
- 已明确确认是 **actual submitted version** 的历史/真实投递快照，如果本来超过 2 页，不得为了过 validator 擅自删内容；允许原样归档，并在 manifest 中记录明确的 page-limit exception（例如 `actual_submitted_version_confirmed`）。
- 代表性故障 `APP-2026-16M-0032`：最终 TeX 已存在但 PDF 一直缺失，最终确认根因是 TeX 编译为 3 页，被旧 `--max-pages 2` validator 拒绝。修复后 PDF/TXT/autofill packet/manifest 均可正常落盘。不要再把类似情况简单诊断成“Action 漏跑”。

### 0.4 Autofill 数据权威层级

当前 Autofill 必须保持三层 source-of-truth：

1. **Global Application Profile**：所有招聘网站共用的稳定资料，权威文件位于 `XinyuIvy/CV/master/application-forms/application-autofill-profile.md`。教育详细字段、导师/学院/研究单位、GPA/排名/研究方向等属于这一层；不是腾讯专属资料。
2. **Site-specific profile / override**：只放某家网站独有且不能泛化的字段，例如某招聘站自己的事业群、调剂选项或语义特殊的下拉框。
3. **APP-specific final CV packet**：项目、经历描述、Skills、项目排序、项目链接、最终 PDF 等岗位相关内容全部以当前 APP 的最终 customized CV 为准。General profile 不得维护第二套项目介绍。

项目 URL 已接入最终 CV packet parser：若最终 TeX 中某 project / independent system 有 `\\href` / `\\url`，packet 可携带其链接；表单询问项目链接时使用当前 APP packet。CV 中没有链接则留空，不猜。

教育 Autofill 已按 **general capability** 方向做，而不是腾讯/字节单站 adapter：自定义 `div` label、教育 block 上下文、成对日期字段等要通用识别。字段语义不明确（例如某站单独的“学历类型”）时继续留空，不猜。

