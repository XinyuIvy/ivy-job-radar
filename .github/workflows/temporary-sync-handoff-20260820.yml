### 0.11 长期不能破坏的边界

- Candidate 是一个池：bookmark + `准备材料` application 统一显示，同一岗位一次；不要重新拆成两个状态。
- 用户选择的 CV template/language 是一级权威；Prompt、application record、base TeX 必须一致。
- Job Radar 的 preliminary classification 不是最终事实；Chat 独立审核完整 JD + frozen facts + canonical indexes。
- RAG 只做 evidence 回查，不用 retrieval score 当事实判定。
- general profile 与 APP-specific CV packet 分离；项目描述只来自最终 APP CV。
- 未确认实际提交版本时不得生成 submitted PDF；已确认真实提交版本不得为了 validator 擅改内容。
- 私有 JD / application archive 不得写入公开 Job Radar 或 CV repo。
- 不随机制造 application bundle，不自动替用户选择母版，不无确认自动生成最终 CV。

