name: Apply P0 China salary policy

on:
  push:
    branches:
      - agent/remove-china-salary-hard-filter

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/remove-china-salary-hard-filter
          fetch-depth: 0

      - name: Apply salary-policy changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def read(path: str) -> str:
              return Path(path).read_text(encoding="utf-8")

          def write(path: str, content: str) -> None:
              Path(path).write_text(content, encoding="utf-8")

          def replace_once(path: str, old: str, new: str) -> None:
              content = read(path)
              count = content.count(old)
              if count != 1:
                  raise RuntimeError(f"Expected one match in {path}, found {count}: {old[:100]!r}")
              write(path, content.replace(old, new, 1))

          def regex_once(path: str, pattern: str, replacement: str) -> None:
              content = read(path)
              updated, count = re.subn(pattern, replacement, content, count=1, flags=re.DOTALL)
              if count != 1:
                  raise RuntimeError(f"Expected one regex match in {path}, found {count}: {pattern}")
              write(path, updated)

          # BOSS: retain salary metadata but never reject a listing because of salary.
          replace_once(
              "local-collector/boss_radar.py",
              '''    salary_floor = monthly_salary_floor_k(salary_text(row))
              if salary_floor is not None and salary_floor < 20:
                  return "salary_below_20k"
          ''',
              "",
          )
          replace_once(
              "local-collector/boss_radar.py",
              '''            if (salary_floor is not None and salary_floor < 20) or (years is not None and years > 3):
                              continue
          ''',
              '''            if years is not None and years > 3:
                              continue
          ''',
          )

          # Public platform scan: remove the salary rejection key and hard-filter branch.
          replace_once(
              "scripts/china_scan.py",
              '    "salary_below_20k",\n',
              "",
          )
          replace_once(
              "scripts/china_scan.py",
              '''    salary_floor = monthly_salary_floor_k(combined)
              if salary_floor is not None and salary_floor < 20:
                  if rejection_stats is not None:
                      rejection_stats["salary_below_20k"] += 1
                  return None
              if salary_floor is None and rejection_stats is not None:
          ''',
              '''    salary_floor = monthly_salary_floor_k(combined)
              if salary_floor is None and rejection_stats is not None:
          ''',
          )

          # Company portals: preserve parsed salary for display, not eligibility.
          replace_once(
              "scripts/company_portal_scan.py",
              '        and (salary_floor is None or salary_floor >= 20)\n',
              "",
          )

          # Website import boundary: salary remains a payload field but is not a gate.
          regex_once(
              "app/api/jobs/import/route.ts",
              r'\nfunction monthlySalaryFloorK\(content: string\) \{.*?\n\}\n\nfunction isEligibleChinaImport',
              '\nfunction isEligibleChinaImport',
          )
          regex_once(
              "app/api/jobs/import/route.ts",
              r'function isEligibleChinaImport\(raw: ImportJob, title: string, description: string, evidence: string\) \{.*?\n\}',
              '''function isEligibleChinaImport(raw: ImportJob, title: string, description: string, evidence: string) {
            const content = `${title} ${description} ${evidence} ${cleanText(raw.salary)}`;
            const years = requiredExperience(content);
            return chinaRelevant.test(content)
              && !chinaExcludedTitle.test(title)
              && !chinaIrrelevant.test(title)
              && !chinaExcludedCore.test(content)
              && (years === null || years <= 3);
          }''',
          )

          # UI: remove obsolete salary rejection labels and explain the new policy.
          replace_once("app/job-radar.tsx", '  salary_below_20k: "工资下限不足 20K",\n', "")
          replace_once("app/job-radar.tsx", '  salary_below_20k_or_missing: "工资不足或缺失",\n', "")
          regex_once(
              "app/job-radar.tsx",
              r'排除原因：缺少标题或链接 \{chinaProgress\.rejectionReasons\.missing_title_or_url.*?保留待核验：工资缺失或面议 \{chinaProgress\.reviewCounts\?\.salary_missing_or_negotiable \?\? chinaProgress\.rejectionReasons\.salary_missing_or_negotiable \?\? 0\}。',
              '排除原因：缺少标题或链接 {chinaProgress.rejectionReasons.missing_title_or_url ?? chinaProgress.rejectionReasons.missing_required_fields ?? 0}；关键词不匹配 {chinaProgress.rejectionReasons.title_not_targeted ?? 0}；高年资、工程类或无关岗位 {chinaProgress.rejectionReasons.excluded_seniority_or_role ?? 0}；经验超过 3 年或核心方向不符 {chinaProgress.rejectionReasons.degree_experience_or_skill_gap ?? 0}。工资字段仅用于展示和待核验，不参与自动排除；工资缺失或面议 {chinaProgress.reviewCounts?.salary_missing_or_negotiable ?? chinaProgress.rejectionReasons.salary_missing_or_negotiable ?? 0}。',
          )

          # BOSS regression tests: both list and detail stages must keep low salary jobs.
          replace_once("tests/test_boss_radar.py", '                    "salary": "20-30K·13薪",\n', '                    "salary": "15-18K·13薪",\n')
          replace_once(
              "tests/test_boss_radar.py",
              '        self.assertFalse(BOSS_RADAR.title_prefilter({**base, "job_id": "low", "title": "统计建模研究员", "salary": "15-30K"}))\n',
              '        self.assertTrue(BOSS_RADAR.title_prefilter({**base, "job_id": "low", "title": "统计建模研究员", "salary": "15-30K"}))\n',
          )
          replace_once(
              "tests/test_boss_radar.py",
              '''        self.assertEqual(
                      BOSS_RADAR.title_prefilter_reason({**base, "job_id": "low", "title": "统计建模研究员", "salary": "15-30K"}),
                      "salary_below_20k",
                  )
          ''',
              '''        self.assertEqual(
                      BOSS_RADAR.title_prefilter_reason({**base, "job_id": "low", "title": "统计建模研究员", "salary": "15-30K"}),
                      "",
                  )
          ''',
          )

          # Public-index regression tests: low monthly and daily rates remain eligible.
          replace_once(
              "tests/test_china_scan.py",
              '''        self.assertEqual(stats[0]["source_status"], "rate_limited")
                  self.assertEqual(stats[0]["matched"], 0)
                  self.assertEqual(stats[0]["rejected"]["salary_below_20k"], 1)
          ''',
              '''        self.assertEqual(stats[0]["source_status"], "rate_limited")
                  self.assertEqual(stats[0]["matched"], 1)
                  self.assertNotIn("salary_below_20k", stats[0]["rejected"])
          ''',
          )
          regex_once(
              "tests/test_china_scan.py",
              r'    def test_low_chinese_platform_salary_is_rejected\(self\):.*?\n    def test_parses_brave_result_without_unrelated_navigation_links',
              '''    def test_low_chinese_platform_salary_is_kept(self):
                  stats = CHINA_SCAN.empty_filter_stats()
                  row = CHINA_SCAN.normalize_result(
                      {
                          "title": "数据分析师招聘 | 广州 | 1-1.5万 | 某科技股份有限公司",
                          "url": "https://jobs.51job.com/guangzhou/172962369.html",
                          "description": "统计学专业，熟练使用 SQL。",
                      },
                      {"source": "前程无忧", "query": "site:jobs.51job.com 数据分析师"},
                      "2026-08-02T00:00:00+00:00",
                      stats,
                  )

                  self.assertIsNotNone(row)
                  self.assertEqual(row["salary_min_monthly_k"], 10)
                  self.assertNotIn("salary_below_20k", stats)

              def test_low_daily_rate_is_kept_when_role_is_otherwise_eligible(self):
                  stats = CHINA_SCAN.empty_filter_stats()
                  row = CHINA_SCAN.normalize_result(
                      {
                          "title": "数据分析师",
                          "url": "https://jobs.51job.com/shanghai/172962370.html",
                          "description": "统计学专业，熟练使用 SQL，300元/天。",
                      },
                      {"source": "前程无忧", "query": "site:jobs.51job.com 数据分析师"},
                      "2026-08-02T00:00:00+00:00",
                      stats,
                  )

                  self.assertIsNotNone(row)
                  self.assertAlmostEqual(row["salary_min_monthly_k"], 6.525)
                  self.assertNotIn("salary_below_20k", stats)

              def test_parses_brave_result_without_unrelated_navigation_links''',
          )
          content = read("tests/test_china_scan.py").replace('            "salary_below_20k": 0,\n', "")
          write("tests/test_china_scan.py", content)

          # Company portal regression test.
          replace_once(
              "tests/test_company_portal_scan.py",
              '    company_rows,\n',
              '    company_rows,\n    china_job_eligible,\n',
          )
          replace_once(
              "tests/test_company_portal_scan.py",
              '    def test_normalizes_nested_enterprise_location(self) -> None:\n',
              '''    def test_china_portal_salary_is_diagnostic_not_eligibility(self) -> None:
                  eligible, salary_floor = china_job_eligible(
                      "数据科学家",
                      "统计学博士，经验不限，使用 Python 开展医疗数据分析。",
                      "15-18K",
                  )
                  self.assertTrue(eligible)
                  self.assertEqual(salary_floor, 15)

              def test_normalizes_nested_enterprise_location(self) -> None:
          ''',
          )

          # The volatile 51job public index may legitimately return zero target roles.
          replace_once(
              ".github/workflows/test-china-platforms.yml",
              '''          - id: 51job
                        source: 前程无忧
                        query: site:jobs.51job.com 数据分析师 统计学
                        minimum_matched: 1
                        availability_policy: allow-limited
          ''',
              '''          - id: 51job
                        source: 前程无忧
                        query: site:jobs.51job.com 数据分析师 统计学
                        minimum_matched: 0
                        availability_policy: allow-limited
          ''',
          )

          # Add a policy-level guard that prevents salary rejection logic from returning.
          Path("tests/test_salary_policy.py").write_text(
              '''from pathlib import Path
          import unittest


          ROOT = Path(__file__).resolve().parents[1]


          class SalaryPolicyTests(unittest.TestCase):
              def test_salary_is_not_a_hard_filter(self) -> None:
                  source_paths = [
                      ROOT / "local-collector" / "boss_radar.py",
                      ROOT / "scripts" / "china_scan.py",
                      ROOT / "scripts" / "company_portal_scan.py",
                      ROOT / "app" / "api" / "jobs" / "import" / "route.ts",
                  ]
                  combined = "\n".join(path.read_text(encoding="utf-8") for path in source_paths)
                  self.assertNotIn("salary_below_20k", combined)
                  self.assertNotRegex(combined, r"salary_floor[^\n]*(?:<\s*20|>=\s*20)")


          if __name__ == "__main__":
              unittest.main()
          ''',
              encoding="utf-8",
          )

          # Remove this one-off workflow before committing the real change.
          Path(".github/workflows/p0-remove-china-salary-filter.yml").unlink()
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-jobscan.txt

      - name: Install Python dependencies
        run: python -m pip install --requirement requirements-jobscan.txt

      - name: Run Python validation
        shell: bash
        run: |
          python -m py_compile local-collector/boss_radar.py scripts/china_scan.py scripts/company_portal_scan.py
          python -m unittest discover -s tests -p 'test_boss*.py'
          python -m unittest discover -s tests -p 'test_china*.py'
          python -m unittest tests.test_company_portal_scan tests.test_salary_policy

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Run website lint and build
        run: |
          npm run lint
          npm run build

      - name: Commit validated changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove China salary hard filters"
          git push origin HEAD:agent/remove-china-salary-hard-filter
