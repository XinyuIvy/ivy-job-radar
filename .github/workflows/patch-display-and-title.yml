name: Patch display and title extraction

on:
  push:
    branches:
      - fix/job-identity-ignore-and-url-add
    paths:
      - scripts/patch_display_and_title_extraction.py
      - .github/workflows/patch-display-and-title.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/job-identity-ignore-and-url-add
          fetch-depth: 0
      - name: Apply display and title patches
        run: python3 scripts/patch_display_and_title_extraction.py
      - name: Remove one-off patcher and commit result
        run: |
          rm scripts/patch_display_and_title_extraction.py .github/workflows/patch-display-and-title.yml
          git add app/api/jobs/route.ts app/bookmarklet/bookmarklet-installer.tsx scripts/patch_display_and_title_extraction.py .github/workflows/patch-display-and-title.yml
          if git diff --cached --quiet; then
            echo "No patch changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Improve job title extraction and display deduplication"
          git push origin HEAD:fix/job-identity-ignore-and-url-add
