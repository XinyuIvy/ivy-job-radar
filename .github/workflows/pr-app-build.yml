name: PR app build

on:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "db/**"
      - "tests/*.test.mjs"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "scripts/sites-*.sh"
      - ".github/workflows/pr-app-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run RAG and structured-evidence regression tests
        run: >-
          node --loader @esbuild-kit/esm-loader --test
          tests/hybrid-rag.test.mjs
          tests/structured-evidence.test.mjs
          tests/latex-text.test.mjs
          tests/cv-tailor-alibaba.test.mjs
          tests/conference-evidence.test.mjs
      - name: Build deployable Sites artifact
        run: |
          chmod +x scripts/*.sh
          npm run build
      - name: Run rendered artifact smoke test
        run: node --test tests/rendered-html.test.mjs
