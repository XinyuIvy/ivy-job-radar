name: One-off conference loader patch

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/patch_conference_loader.py"
      - ".github/workflows/oneoff-conference-loader.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/patch_conference_loader.py
      - name: Commit loader patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/cv-tailor/analyze/route.ts
          git commit -m "Load conference evidence in CV Tailor"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
