name: PR app lint

on:
  pull_request:
    paths:
      - "app/**"
      - "db/**"
      - "worker/**"
      - "build/**"
      - "vite.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pr-app-lint.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-app-lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run app lint
        run: |
          chmod +x scripts/*.sh
          npm run lint
