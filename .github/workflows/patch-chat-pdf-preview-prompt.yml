name: Patch chat PDF preview prompt

on:
  push:
    branches:
      - feature/chat-pdf-preview-workflow
    paths:
      - scripts/patch_chat_pdf_preview_prompt.py
      - .github/workflows/patch-chat-pdf-preview-prompt.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/chat-pdf-preview-workflow
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply prompt and test changes
        run: python scripts/patch_chat_pdf_preview_prompt.py
      - name: Remove one-off patcher
        run: |
          rm scripts/patch_chat_pdf_preview_prompt.py
          rm .github/workflows/patch-chat-pdf-preview-prompt.yml
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/lib/application-archive.ts tests/test_application_archive_source.py scripts/patch_chat_pdf_preview_prompt.py .github/workflows/patch-chat-pdf-preview-prompt.yml
          git commit -m "Allow local PDF previews during CV review"
          git push origin HEAD:feature/chat-pdf-preview-workflow
