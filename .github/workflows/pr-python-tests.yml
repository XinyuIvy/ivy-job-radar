name: Apply and validate salary-filter removal

on:
  pull_request:
    paths:
      - "scripts/apply_remove_salary_filters.py"
      - ".github/workflows/pr-python-tests.yml"
      - "scripts/**"
      - "local-collector/**"
      - "app/**"
      - "tests/**"
      - "vite.config.ts"
      - "build/**"

permissions:
  contents: write

concurrency:
  group: apply-salary-filter-removal-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out P0 branch
        uses: actions/checkout@v4
        with:
          ref: agent/remove-china-salary-hard-filter
          fetch-depth: 0

      - name: Apply direct source migration
        run: python scripts/apply_remove_salary_filters.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-jobscan.txt

      - name: Install dependencies
        run: python -m pip install --requirement requirements-jobscan.txt

      - name: Validate Python and policy
        shell: bash
        run: |
          python -m py_compile local-collector/boss_radar.py scripts/china_scan.py scripts/company_portal_scan.py
          python -m unittest discover -s tests -p 'test_*.py'
          if git grep -nE 'salary_below_20k|salary_floor[^[:space:]]*.*(<[[:space:]]*20|>=[[:space:]]*20)|工资下限不足 20K' -- \
            local-collector scripts app/api app/job-radar.tsx tests; then
            echo 'Salary filtering code still exists.' >&2
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Validate website
        run: |
          npm run lint
          npm run build

      - name: Commit direct source changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove China salary filters from direct sources"
          git push origin HEAD:agent/remove-china-salary-hard-filter
